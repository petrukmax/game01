<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт в разработке</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a535c 0%, #2e8b57 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            color: #e0f7fa;
        }
        
        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            color: #e0f7fa;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #e0f7fa;
            animation: spin 1s ease-in-out infinite;
            margin: 2rem auto;
        }
        
        .progress {
            width: 80%;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin: 2rem auto;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #4caf50, #2e7d32);
            border-radius: 4px;
            animation: progress 3s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes progress {
            0%, 100% { width: 40%; }
            50% { width: 70%; }
        }
        
        .note {
            font-size: 1.1rem;
            margin-top: 2rem;
            opacity: 0.8;
            color: #e0f7fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Сайт в разработке</h1>
        <p class="subtitle">Мы создаём что-то удивительное!</p>
        <div class="spinner"></div>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
        <p class="note">Этот проект находится в активной разработке. Загляните позже — будет ещё лучше!</p>
    </div>
</body>
</html>
